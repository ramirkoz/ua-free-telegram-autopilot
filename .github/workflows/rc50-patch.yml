name: RC50 One-shot Patch

on:
  push:
    branches: [hotfix/rc50-media-languagetool]
    paths:
      - tools/rc50_patch.py
      - .github/workflows/rc50-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/rc50-media-languagetool
          fetch-depth: 0

      - name: Apply RC50 source patch
        run: python tools/rc50_patch.py

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced by patch script"
            exit 0
          fi
          git commit -m "fix: RC50 media policy and LanguageTool health checks"
          git push origin HEAD:hotfix/rc50-media-languagetool
