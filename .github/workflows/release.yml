name: Autopilot V2 Release

on:
  push:
    branches: [main]
    paths:
      - VERSION.txt
      - PUBLIC_VERSION.txt
      - V2_VERSION.txt
      - RELEASE_NOTES_v*.md
      - V2_RELEASE_NOTES_v*.md
      - app_v2.py
      - telegram_autopilot/**
      - requirements.txt
      - requirements-test.txt
      - pyproject.toml
      - README.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate canonical V2 metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $public = (Get-Content PUBLIC_VERSION.txt -Raw).Trim()
          $v2 = (Get-Content V2_VERSION.txt -Raw).Trim()
          if (-not $version) { throw 'VERSION.txt is empty' }
          if ($version -ne $public -or $version -ne $v2) { throw "Version mismatch: VERSION=$version PUBLIC=$public V2=$v2" }
          $notes = "RELEASE_NOTES_v$version.md"
          if (-not (Test-Path $notes)) { throw "Missing $notes" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NOTES=$notes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile and run regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m compileall -q telegram_autopilot tests app_v2.py
          if ($LASTEXITCODE -ne 0) { throw 'compileall failed' }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'pytest failed' }
          python -m pytest -q tests/test_v2_migration_windows.py tests/test_v2_credentials_migration.py
          if ($LASTEXITCODE -ne 0) { throw 'V2 migration regressions failed' }
          python -c "from telegram_autopilot import __version__; from telegram_autopilot.v2 import V2_VERSION; assert __version__ == V2_VERSION == '$env:VERSION', (__version__, V2_VERSION); print('V2_VERSION_OK', V2_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'V2 version gate failed' }

      - name: Enforce clean V2 contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import pathlib, re
          root = pathlib.Path('telegram_autopilot/v2')
          bad = []
          patterns = (
              r'install_rc', r'_PREV\[', r'from\s+\.\.rc\d', r'from\s+\.rc\d',
              r'import\s+telegram_autopilot\.rc\d', r'from\s+\.\.\s+import\s+rc\d',
          )
          for path in root.glob('*.py'):
              text = path.read_text(encoding='utf-8')
              for pattern in patterns:
                  if re.search(pattern, text):
                      bad.append(f'{path}: {pattern}')
          if bad:
              raise SystemExit('V2 RC contamination:\n' + '\n'.join(bad))
          migration = pathlib.Path('telegram_autopilot/v2/migration_service.py').read_text(encoding='utf-8')
          if 'os.replace(' in migration:
              raise SystemExit('Windows-unsafe os.replace remains in migration_service.py')
          credentials = pathlib.Path('telegram_autopilot/v2/legacy_credentials.py').read_text(encoding='utf-8')
          if 'with_suffix(".migration.tmp")' in credentials or "with_suffix('.migration.tmp')" in credentials:
              raise SystemExit('Credential temp-name collision pattern returned')
          print('V2_CLEAN_CONTRACT_OK')
          '@ | Set-Content -Path $env:RUNNER_TEMP\v2_clean_gate.py -Encoding utf8
          python $env:RUNNER_TEMP\v2_clean_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'V2 clean-source gate failed' }

      - name: Build signed V2 portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist-v2'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $portableName = "UA_FREE_Telegram_Autopilot_v$env:VERSION`_Windows_Portable"
          $stage = Join-Path $dist $portableName
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $pyHome = (python -c "import sys; print(sys.base_prefix)").Trim()
          $pythonExe = Join-Path $pyHome 'python.exe'
          $pythonwExe = Join-Path $pyHome 'pythonw.exe'
          if (-not (Test-Path $pythonExe)) { throw "Python runtime not found: $pythonExe" }
          if (-not (Test-Path $pythonwExe)) { throw "Signed pythonw runtime not found: $pythonwExe" }
          Copy-Item -Path (Join-Path $pyHome '*') -Destination $stage -Recurse -Force

          Copy-Item telegram_autopilot -Destination $stage -Recurse -Force
          Copy-Item app_v2.py,VERSION.txt,PUBLIC_VERSION.txt,V2_VERSION.txt,README.md,$env:NOTES -Destination $stage -Force
          Get-ChildItem (Join-Path $stage 'telegram_autopilot') -File -Filter 'rc*.py' -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem $stage -Directory -Recurse -Filter '__pycache__' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $stage -File -Recurse -Filter '*.pyc' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $stage 'Data') -Recurse -Force -ErrorAction SilentlyContinue

          Copy-Item $pythonExe (Join-Path $stage '_runtime_console.exe') -Force
          Copy-Item $pythonwExe (Join-Path $stage 'UA_FREE_Telegram_Autopilot.exe') -Force
          @('.', 'DLLs', 'Lib', 'Lib\site-packages', 'import site') | Set-Content -Path (Join-Path $stage '_runtime_console._pth') -Encoding ascii
          @('.', 'DLLs', 'Lib', 'Lib\site-packages', 'import site') | Set-Content -Path (Join-Path $stage 'UA_FREE_Telegram_Autopilot._pth') -Encoding ascii
          @'
          import os
          import sys
          if os.path.basename(sys.executable).casefold() == 'ua_free_telegram_autopilot.exe':
              from telegram_autopilot.v2.main import main
              os._exit(int(main() or 0))
          '@ | Set-Content -Path (Join-Path $stage 'sitecustomize.py') -Encoding utf8

          @"
          UA FREE Telegram Autopilot V2 $env:VERSION

          Розпакуйте у НОВУ папку і запустіть UA_FREE_Telegram_Autopilot.exe.
          Для перенесення RC82: «Міграція» → «Імпортувати стару Data».
          V2 database: Data\telegram_autopilot_v2.sqlite3
          Backup міграції: Data\migration_backups
          Логи: Data\logs\v2
          "@ | Set-Content -Path (Join-Path $stage 'README_V2.txt') -Encoding utf8

          New-Item -ItemType File -Force -Path (Join-Path $stage 'portable.flag') | Out-Null
          $rcFiles = @(Get-ChildItem (Join-Path $stage 'telegram_autopilot') -File -Filter 'rc*.py' -ErrorAction SilentlyContinue)
          if ($rcFiles.Count -ne 0) { throw "Historical RC modules remain in portable: $($rcFiles.Name -join ', ')" }
          "PORTABLE_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTABLE_NAME=$portableName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate clean packaged imports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:PORTABLE_STAGE
          try {
            & .\_runtime_console.exe -I -c "from telegram_autopilot import __version__; from telegram_autopilot.v2 import V2_VERSION; from telegram_autopilot.v2.storage import V2Store; from telegram_autopilot.v2.runtime import RuntimeEngine; from telegram_autopilot.v2.ui import MainWindow; from telegram_autopilot.v2.migration_service import MigrationManager; assert __version__ == V2_VERSION == '$env:VERSION'; print('V2_PACKAGED_IMPORT_OK', V2_VERSION)"
            if ($LASTEXITCODE -ne 0) { throw 'Packaged V2 import gate failed' }
          } finally {
            Pop-Location
          }

      - name: Native Windows credential-pair migration smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = $env:PORTABLE_STAGE
          $legacy = Join-Path $env:RUNNER_TEMP 'v2-legacy-credentials-Data'
          $target = Join-Path $env:RUNNER_TEMP 'v2-credentials-target'
          Remove-Item $legacy,$target -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $legacy,$target | Out-Null
          Set-Content -Path (Join-Path $legacy 'secrets.key') -Value 'legacy-key-native-windows' -NoNewline -Encoding ascii
          Set-Content -Path (Join-Path $legacy 'secrets.secure') -Value 'legacy-secure-native-windows' -NoNewline -Encoding ascii
          $env:LEGACY_DATA_SMOKE = $legacy
          $env:UA_FREE_TELEGRAM_AUTOPILOT_DATA = $target
          Push-Location $stage
          try {
            & .\_runtime_console.exe -I -c "import os,sqlite3,pathlib; p=pathlib.Path(os.environ['LEGACY_DATA_SMOKE']); sqlite3.connect(p/'telegram_autopilot.sqlite3').close(); from telegram_autopilot.v2.legacy_credentials import import_legacy_secrets; ok,msg=import_legacy_secrets(p); t=pathlib.Path(os.environ['UA_FREE_TELEGRAM_AUTOPILOT_DATA']); assert ok,msg; assert (t/'secrets.key').read_bytes()==b'legacy-key-native-windows'; assert (t/'secrets.secure').read_bytes()==b'legacy-secure-native-windows'; assert not list(t.glob('*.migration.tmp')); print('V2_NATIVE_WINDOWS_CREDENTIAL_PAIR_PASS')"
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows credential migration smoke failed' }
          } finally {
            Pop-Location
            Remove-Item Env:LEGACY_DATA_SMOKE -ErrorAction SilentlyContinue
            Remove-Item Env:UA_FREE_TELEGRAM_AUTOPILOT_DATA -ErrorAction SilentlyContinue
          }

      - name: Validate signed launcher and native Windows GUI startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = $env:PORTABLE_STAGE
          $launcher = Join-Path $stage 'UA_FREE_Telegram_Autopilot.exe'
          $signature = Get-AuthenticodeSignature $launcher
          if ($signature.Status -ne 'Valid') { throw "Launcher signature is not valid: $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch 'Python Software Foundation') { throw "Unexpected launcher signer: $($signature.SignerCertificate.Subject)" }
          $smokeData = Join-Path $env:RUNNER_TEMP 'autopilot-v2-smoke-data'
          Remove-Item $smokeData -Recurse -Force -ErrorAction SilentlyContinue
          $env:UA_FREE_TELEGRAM_AUTOPILOT_DATA = $smokeData
          $p = Start-Process -FilePath $launcher -WorkingDirectory $stage -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "Packaged V2 EXE exited during smoke test with code $($p.ExitCode)" }
          $db = Join-Path $smokeData 'telegram_autopilot_v2.sqlite3'
          if (-not (Test-Path $db)) { throw 'Packaged V2 EXE did not initialize telegram_autopilot_v2.sqlite3' }
          & taskkill.exe /PID $p.Id /T /F | Out-Null
          Remove-Item Env:UA_FREE_TELEGRAM_AUTOPILOT_DATA -ErrorAction SilentlyContinue
          Write-Host 'V2_NATIVE_WINDOWS_GUI_SMOKE_PASS'

      - name: Microsoft Defender scan extracted portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $scanner) { throw 'Microsoft Defender command-line scanner is unavailable' }
          & $scanner.FullName -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { throw "Defender signature update failed: $LASTEXITCODE" }
          & $scanner.FullName -Scan -ScanType 3 -File $env:PORTABLE_STAGE -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender detected or could not scan extracted V2 runtime: $LASTEXITCODE" }

      - name: Build release archives and checksums
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist-v2'
          $portableZip = Join-Path $dist "$env:PORTABLE_NAME.zip"
          Compress-Archive -Path (Join-Path $env:PORTABLE_STAGE '*') -DestinationPath $portableZip -CompressionLevel Optimal -Force

          $sourceName = "UA_FREE_Telegram_Autopilot_v$env:VERSION`_Source"
          $sourceStage = Join-Path $dist $sourceName
          New-Item -ItemType Directory -Force -Path $sourceStage | Out-Null
          Copy-Item telegram_autopilot -Destination $sourceStage -Recurse -Force
          Get-ChildItem (Join-Path $sourceStage 'telegram_autopilot') -File -Filter 'rc*.py' -ErrorAction SilentlyContinue | Remove-Item -Force
          Copy-Item app_v2.py,VERSION.txt,PUBLIC_VERSION.txt,V2_VERSION.txt,README.md,requirements.txt,requirements-test.txt,pyproject.toml,$env:NOTES -Destination $sourceStage -Force
          Get-ChildItem $sourceStage -Directory -Recurse -Filter '__pycache__' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $sourceStage -File -Recurse -Filter '*.pyc' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          $sourceZip = Join-Path $dist "$sourceName.zip"
          Compress-Archive -Path (Join-Path $sourceStage '*') -DestinationPath $sourceZip -CompressionLevel Optimal -Force

          $portableHash = (Get-FileHash $portableZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaFile = Join-Path $dist "UA_FREE_Telegram_Autopilot_v$env:VERSION`_SHA256SUMS.txt"
          @("$portableHash  $([IO.Path]::GetFileName($portableZip))", "$sourceHash  $([IO.Path]::GetFileName($sourceZip))") | Set-Content $shaFile -Encoding ascii

          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          & $scanner.FullName -Scan -ScanType 3 -File $portableZip -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender detected or could not scan V2 ZIP: $LASTEXITCODE" }
          "portable_zip=$portableZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_zip=$sourceZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha_file=$shaFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "portable_sha256=$portableHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload exact release assets for synchronization
        uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Telegram_Autopilot_v${{ env.VERSION }}_RELEASE_ASSETS
          path: |
            ${{ steps.assets.outputs.portable_zip }}
            ${{ steps.assets.outputs.source_zip }}
            ${{ steps.assets.outputs.sha_file }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish or refresh GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:VERSION"
          $portableZip = "${{ steps.assets.outputs.portable_zip }}"
          $sourceZip = "${{ steps.assets.outputs.source_zip }}"
          $shaFile = "${{ steps.assets.outputs.sha_file }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "UA FREE Telegram Autopilot V2 $env:VERSION" --notes-file $env:NOTES --prerelease
            gh release upload $tag $portableZip $sourceZip $shaFile --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $portableZip $sourceZip $shaFile --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "UA FREE Telegram Autopilot V2 $env:VERSION" --notes-file $env:NOTES --prerelease
          }
          Write-Host "V2_RELEASE_PUBLISHED $tag SHA256=${{ steps.assets.outputs.portable_sha256 }}"

      - name: Report release synchronization status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          $description = if ($state -eq 'success') { "v$env:VERSION V2 release passed" } else { "v$env:VERSION V2 release failed" }
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$state" -f context='release-sync' -f description="$description" -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
