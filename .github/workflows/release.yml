name: Autopilot V2 Release

on:
  push:
    branches: [main]
    paths:
      - VERSION.txt
      - PUBLIC_VERSION.txt
      - V2_VERSION.txt
      - RELEASE_NOTES_v*.md
      - requirements.txt
      - telegram_autopilot/**
      - tests/**
      - app_v2.py
      - pyproject.toml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate V2 release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content VERSION.txt -Raw).Trim()
          $public=(Get-Content PUBLIC_VERSION.txt -Raw).Trim()
          $v2=(Get-Content V2_VERSION.txt -Raw).Trim()
          if (-not $version) { throw 'VERSION.txt is empty' }
          if ($version -ne $public -or $version -ne $v2) { throw "Version mismatch: $version / $public / $v2" }
          $notes="RELEASE_NOTES_v$version.md"
          if (-not (Test-Path $notes)) { throw "Missing $notes" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NOTES=$notes" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install source and test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile and run regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m compileall -q telegram_autopilot tests app_v2.py
          if ($LASTEXITCODE -ne 0) { throw 'compileall failed' }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'pytest failed' }
          python -m pytest -q tests/test_v2_migration_windows.py tests/test_v2_credentials_migration.py
          if ($LASTEXITCODE -ne 0) { throw 'migration regressions failed' }
          python -c "import openai_codex; from telegram_autopilot import __version__; from telegram_autopilot.v2 import V2_VERSION; assert __version__ == V2_VERSION == '$env:VERSION'; print('SOURCE_CODEX_AND_VERSION_OK', getattr(openai_codex,'__version__','unknown'))"
          if ($LASTEXITCODE -ne 0) { throw 'Codex/version source gate failed' }

      - name: Enforce clean active V2 contract
        shell: pwsh
        run: |
          @'
          import pathlib,re
          bad=[]
          for path in pathlib.Path('telegram_autopilot/v2').glob('*.py'):
              text=path.read_text(encoding='utf-8')
              for pattern in (r'install_rc',r'_PREV\[',r'from\s+\.\.rc\d',r'from\s+\.rc\d',r'import\s+telegram_autopilot\.rc\d'):
                  if re.search(pattern,text): bad.append(f'{path}: {pattern}')
          if bad: raise SystemExit('V2 RC contamination:\n'+'\n'.join(bad))
          print('V2_CLEAN_ACTIVE_RUNTIME_OK')
          '@ | Set-Content $env:RUNNER_TEMP\v2_clean.py -Encoding utf8
          python $env:RUNNER_TEMP\v2_clean.py
          if ($LASTEXITCODE -ne 0) { throw 'clean V2 gate failed' }

      - name: Build compact signed V2 portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dist=Join-Path $PWD 'dist-v2'
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $portableName="UA_FREE_Telegram_Autopilot_v$env:VERSION`_Windows_Portable"
          $stage=Join-Path $dist $portableName
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $pyHome=(python -c "import sys; print(sys.base_prefix)").Trim()
          $pythonExe=Join-Path $pyHome 'python.exe'
          $pythonwExe=Join-Path $pyHome 'pythonw.exe'

          foreach($name in @('python.exe','pythonw.exe','python3.dll','python312.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            $src=Join-Path $pyHome $name
            if(Test-Path $src){ Copy-Item $src (Join-Path $stage $name) -Force }
          }
          foreach($dir in @('DLLs','Lib','tcl')) {
            $src=Join-Path $pyHome $dir
            if(Test-Path $src){ Copy-Item $src (Join-Path $stage $dir) -Recurse -Force }
          }

          $sp=Join-Path $stage 'Lib\site-packages'
          Remove-Item $sp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $sp | Out-Null
          foreach($junk in @('Lib\test','Lib\idlelib','Lib\ensurepip','Lib\tkinter\test','Lib\unittest\test')) {
            Remove-Item (Join-Path $stage $junk) -Recurse -Force -ErrorAction SilentlyContinue
          }

          python -m pip install --disable-pip-version-check --no-compile --target $sp 'cryptography>=42,<47' 'Telethon>=1.36,<2' 'Pillow>=11.3,<13' pip
          if ($LASTEXITCODE -ne 0) { throw 'portable runtime dependency install failed' }

          Copy-Item telegram_autopilot -Destination $stage -Recurse -Force
          Copy-Item app_v2.py,VERSION.txt,PUBLIC_VERSION.txt,V2_VERSION.txt,README.md,$env:NOTES -Destination $stage -Force
          Get-ChildItem (Join-Path $stage 'telegram_autopilot') -File -Filter 'rc*.py' -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem $stage -Directory -Recurse -Filter '__pycache__' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $stage -File -Recurse -Filter '*.pyc' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $stage 'Data') -Recurse -Force -ErrorAction SilentlyContinue

          Copy-Item $pythonExe (Join-Path $stage '_runtime_console.exe') -Force
          Copy-Item $pythonwExe (Join-Path $stage 'UA_FREE_Telegram_Autopilot.exe') -Force
          @('.', 'DLLs', 'Lib', 'Lib\site-packages', 'import site') | Set-Content (Join-Path $stage '_runtime_console._pth') -Encoding ascii
          @('.', 'DLLs', 'Lib', 'Lib\site-packages', 'import site') | Set-Content (Join-Path $stage 'UA_FREE_Telegram_Autopilot._pth') -Encoding ascii

          @'
          import json
          import os
          import shutil
          import subprocess
          import sys
          import threading
          import time
          import uuid
          from pathlib import Path

          def _codex_present():
              try:
                  from telegram_autopilot.codex_engine import inspect_codex
                  return bool(inspect_codex().installed)
              except Exception:
                  return False

          def _data_root():
              raw = os.environ.get('UA_FREE_TELEGRAM_AUTOPILOT_DATA', '').strip()
              if raw:
                  return Path(raw)
              return Path(__file__).resolve().parent / 'Data'

          def _bootstrap_codex():
              if _codex_present():
                  return True, ''
              root = Path(__file__).resolve().parent / 'Tools' / 'Codex'
              versions = root / 'codex_versions'
              versions.mkdir(parents=True, exist_ok=True)
              unique = f"codex-0.156.1-{int(time.time())}-{uuid.uuid4().hex[:8]}"
              staging = versions / ('.' + unique + '.tmp')
              target = versions / unique
              staging.mkdir(parents=True, exist_ok=False)
              runtime = Path(__file__).resolve().parent / '_runtime_console.exe'
              command = [str(runtime), '-I', '-m', 'pip', 'install', '--disable-pip-version-check', '--no-input', '--target', str(staging), 'openai-codex==0.156.1']
              env = dict(os.environ)
              env['PYTHONUTF8'] = '1'
              env['UA_FREE_CODEX_BOOTSTRAP'] = '0'
              try:
                  done = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace', timeout=600, env=env, creationflags=getattr(subprocess, 'CREATE_NO_WINDOW', 0))
                  if done.returncode != 0 or not (staging / 'openai_codex').exists():
                      tail='\n'.join(done.stdout.splitlines()[-12:])
                      raise RuntimeError(tail or f'pip exit {done.returncode}')
                  staging.rename(target)
                  pointer = root / 'codex_active.json'
                  temp = root / 'codex_active.tmp'
                  temp.write_text(json.dumps({'directory': target.relative_to(root).as_posix(), 'package': 'openai-codex==0.156.1', 'updated_at': int(time.time())}, ensure_ascii=False, indent=2), encoding='utf-8')
                  os.replace(temp, pointer)
                  return True, ''
              except Exception as exc:
                  shutil.rmtree(staging, ignore_errors=True)
                  return False, str(exc)

          def _first_run_setup():
              if os.environ.get('UA_FREE_CODEX_BOOTSTRAP', '1') == '0' or _codex_present():
                  return True
              if os.environ.get('UA_FREE_CODEX_BOOTSTRAP_ONLY', '') == '1':
                  ok, error = _bootstrap_codex()
                  os._exit(0 if ok else 2)
              try:
                  import tkinter as tk
                  from tkinter import messagebox, ttk
                  root = tk.Tk()
                  root.title('UA FREE Telegram Autopilot · AI runtime')
                  root.geometry('520x175')
                  root.resizable(False, False)
                  ttk.Label(root, text='Перший запуск: встановлюю Codex AI runtime', font=('Segoe UI', 11, 'bold')).pack(pady=(22, 8))
                  ttk.Label(root, text='Це одноразове завантаження. Основна програма залишається компактною.').pack(pady=(0, 12))
                  bar = ttk.Progressbar(root, mode='indeterminate', length=430)
                  bar.pack(pady=4)
                  bar.start(10)
                  result = {'done': False, 'ok': False, 'error': ''}
                  def work():
                      ok, error = _bootstrap_codex()
                      result.update(done=True, ok=ok, error=error)
                  threading.Thread(target=work, daemon=True, name='Codex-FirstRun-Bootstrap').start()
                  def poll():
                      if not result['done']:
                          root.after(250, poll)
                          return
                      bar.stop()
                      if not result['ok']:
                          messagebox.showwarning('Codex не встановлено', 'Не вдалося завантажити AI runtime. Програма відкриється без Codex; повторіть запуск при стабільному інтернеті.\n\n' + result['error'][-1200:], parent=root)
                      root.destroy()
                  root.after(250, poll)
                  root.mainloop()
                  return bool(result['ok'])
              except Exception:
                  return False

          if os.path.basename(sys.executable).casefold() == 'ua_free_telegram_autopilot.exe':
              _first_run_setup()
              from telegram_autopilot.v2.main import main
              os._exit(int(main() or 0))
          '@ | Set-Content (Join-Path $stage 'sitecustomize.py') -Encoding utf8

          @"
          UA FREE Telegram Autopilot V2 $env:VERSION
          Розпакуйте у нову папку та запустіть UA_FREE_Telegram_Autopilot.exe.
          V2 database: Data\telegram_autopilot_v2.sqlite3
          Логи: Data\logs\v2
          Codex 0.156.1 НЕ роздуває базовий portable: при першому запуску він автоматично встановлюється окремо у Tools\Codex.
          Для першого встановлення Codex потрібен інтернет; системний Python не потрібен.
          "@ | Set-Content (Join-Path $stage 'README_V2.txt') -Encoding utf8
          New-Item -ItemType File -Force -Path (Join-Path $stage 'portable.flag') | Out-Null

          $rc=@(Get-ChildItem (Join-Path $stage 'telegram_autopilot') -File -Filter 'rc*.py' -ErrorAction SilentlyContinue)
          if ($rc.Count -ne 0) { throw "RC modules remain in portable: $($rc.Name -join ', ')" }
          if(Test-Path (Join-Path $sp 'openai_codex')) { throw 'Codex was accidentally bundled into the compact portable' }

          $total=(Get-ChildItem $stage -File -Recurse | Measure-Object Length -Sum).Sum
          Write-Host "PORTABLE_EXTRACTED_BYTES=$total"
          if ($total -gt 188743680) { throw "Extracted portable is bloated: $total bytes exceeds 180 MiB guard" }
          Get-ChildItem $stage -Directory | ForEach-Object {
            $sum=(Get-ChildItem $_.FullName -File -Recurse -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            Write-Host ("PORTABLE_DIR {0} {1}" -f $_.Name,$sum)
          }
          "PORTABLE_STAGE=$stage" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTABLE_NAME=$portableName" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate compact base runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:PORTABLE_STAGE
          try {
            & .\_runtime_console.exe -I -c "import importlib.util; from telegram_autopilot import __version__; from telegram_autopilot.v2 import V2_VERSION; from telegram_autopilot.codex_engine import inspect_codex; from telegram_autopilot.v2.storage import V2Store; from telegram_autopilot.v2.runtime import RuntimeEngine; from telegram_autopilot.v2.ui import MainWindow; assert __version__ == V2_VERSION == '$env:VERSION'; assert importlib.util.find_spec('openai_codex') is None; s=inspect_codex(); assert not s.installed; print('V2_COMPACT_BASE_RUNTIME_OK')"
            if ($LASTEXITCODE -ne 0) { throw 'Compact base runtime gate failed' }
          } finally { Pop-Location }

      - name: Validate real first-run Codex bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=$env:PORTABLE_STAGE
          $target=Join-Path $env:RUNNER_TEMP 'v2-codex-bootstrap-data'
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          $env:UA_FREE_TELEGRAM_AUTOPILOT_DATA=$target
          $env:UA_FREE_CODEX_BOOTSTRAP_ONLY='1'
          $launcher=Join-Path $stage 'UA_FREE_Telegram_Autopilot.exe'
          $p=Start-Process -FilePath $launcher -WorkingDirectory $stage -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Codex first-run bootstrap failed: $($p.ExitCode)" }
          Remove-Item Env:UA_FREE_CODEX_BOOTSTRAP_ONLY -ErrorAction SilentlyContinue
          Push-Location $stage
          try {
            & .\_runtime_console.exe -I -c "from telegram_autopilot.codex_engine import inspect_codex; s=inspect_codex(); assert s.installed, s; assert s.version == '0.156.1', s; print('V2_CODEX_FIRST_RUN_BOOTSTRAP_PASS', s.version)"
            if ($LASTEXITCODE -ne 0) { throw 'Installed Codex bootstrap validation failed' }
          } finally {
            Pop-Location
            Remove-Item Env:UA_FREE_TELEGRAM_AUTOPILOT_DATA -ErrorAction SilentlyContinue
            Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Native Windows credential-pair migration smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=$env:PORTABLE_STAGE
          $legacy=Join-Path $env:RUNNER_TEMP 'v2-legacy-credentials-Data'
          $target=Join-Path $env:RUNNER_TEMP 'v2-credentials-target'
          Remove-Item $legacy,$target -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $legacy,$target | Out-Null
          Set-Content (Join-Path $legacy 'secrets.key') 'legacy-key-native-windows' -NoNewline -Encoding ascii
          Set-Content (Join-Path $legacy 'secrets.secure') 'legacy-secure-native-windows' -NoNewline -Encoding ascii
          $env:LEGACY_DATA_SMOKE=$legacy
          $env:UA_FREE_TELEGRAM_AUTOPILOT_DATA=$target
          Push-Location $stage
          try {
            & .\_runtime_console.exe -I -c "import os,sqlite3,pathlib; p=pathlib.Path(os.environ['LEGACY_DATA_SMOKE']); sqlite3.connect(p/'telegram_autopilot.sqlite3').close(); from telegram_autopilot.v2.legacy_credentials import import_legacy_secrets; ok,msg=import_legacy_secrets(p); t=pathlib.Path(os.environ['UA_FREE_TELEGRAM_AUTOPILOT_DATA']); assert ok,msg; assert (t/'secrets.key').read_bytes()==b'legacy-key-native-windows'; assert (t/'secrets.secure').read_bytes()==b'legacy-secure-native-windows'; assert not list(t.glob('*.migration.tmp')); print('V2_NATIVE_CREDENTIAL_PAIR_PASS')"
            if ($LASTEXITCODE -ne 0) { throw 'credential migration smoke failed' }
          } finally {
            Pop-Location
            Remove-Item Env:LEGACY_DATA_SMOKE -ErrorAction SilentlyContinue
            Remove-Item Env:UA_FREE_TELEGRAM_AUTOPILOT_DATA -ErrorAction SilentlyContinue
          }

      - name: Validate signed launcher and native Windows GUI startup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=$env:PORTABLE_STAGE
          $launcher=Join-Path $stage 'UA_FREE_Telegram_Autopilot.exe'
          $sig=Get-AuthenticodeSignature $launcher
          if ($sig.Status -ne 'Valid') { throw "Launcher signature invalid: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'Python Software Foundation') { throw "Unexpected signer: $($sig.SignerCertificate.Subject)" }
          $smoke=Join-Path $env:RUNNER_TEMP 'autopilot-v2-gui-smoke'
          Remove-Item $smoke -Recurse -Force -ErrorAction SilentlyContinue
          $env:UA_FREE_TELEGRAM_AUTOPILOT_DATA=$smoke
          $env:UA_FREE_CODEX_BOOTSTRAP='0'
          $env:UA_FREE_AUTOPILOT_SKIP_FIRST_RUN_IMPORT='1'
          $p=Start-Process -FilePath $launcher -WorkingDirectory $stage -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "Packaged V2 EXE exited: $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $smoke 'telegram_autopilot_v2.sqlite3'))) { throw 'V2 DB not initialized' }
          & taskkill.exe /PID $p.Id /T /F | Out-Null
          Remove-Item Env:UA_FREE_CODEX_BOOTSTRAP -ErrorAction SilentlyContinue
          Remove-Item Env:UA_FREE_AUTOPILOT_SKIP_FIRST_RUN_IMPORT -ErrorAction SilentlyContinue
          Remove-Item Env:UA_FREE_TELEGRAM_AUTOPILOT_DATA -ErrorAction SilentlyContinue
          Write-Host 'V2_NATIVE_GUI_SMOKE_PASS'

      - name: Microsoft Defender scan extracted portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $scanner=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $scanner) { throw 'Defender scanner unavailable' }
          & $scanner.FullName -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { throw "Defender update failed: $LASTEXITCODE" }
          & $scanner.FullName -Scan -ScanType 3 -File $env:PORTABLE_STAGE -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender runtime scan failed: $LASTEXITCODE" }

      - name: Build portable, clean source and checksums
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dist=Join-Path $PWD 'dist-v2'
          $stage=$env:PORTABLE_STAGE
          $portableZip=Join-Path $dist "$env:PORTABLE_NAME.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $portableZip -CompressionLevel Optimal -Force
          $portableBytes=(Get-Item $portableZip).Length
          Write-Host "PORTABLE_ZIP_BYTES=$portableBytes"
          if ($portableBytes -gt 83886080) { throw "Portable ZIP is bloated: $portableBytes bytes exceeds 80 MiB guard" }

          $sourceName="UA_FREE_Telegram_Autopilot_v$env:VERSION`_Source"
          $sourceStage=Join-Path $dist $sourceName
          New-Item -ItemType Directory -Force -Path $sourceStage | Out-Null
          Copy-Item telegram_autopilot -Destination $sourceStage -Recurse -Force
          Get-ChildItem (Join-Path $sourceStage 'telegram_autopilot') -File -Filter 'rc*.py' -ErrorAction SilentlyContinue | Remove-Item -Force
          foreach($item in @('.github','tests','app_v2.py','pyproject.toml','requirements.txt','requirements-test.txt','README.md','VERSION.txt','PUBLIC_VERSION.txt','V2_VERSION.txt',$env:NOTES)) {
            if(Test-Path $item){ Copy-Item $item -Destination $sourceStage -Recurse -Force }
          }
          Get-ChildItem $sourceStage -Directory -Recurse -Filter '__pycache__' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $sourceStage -File -Recurse -Filter '*.pyc' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $sourceStage '.verify') -Recurse -Force -ErrorAction SilentlyContinue
          $sourceZip=Join-Path $dist "$sourceName.zip"
          Compress-Archive -Path (Join-Path $sourceStage '*') -DestinationPath $sourceZip -CompressionLevel Optimal -Force

          $shaFile=Join-Path $dist "UA_FREE_Telegram_Autopilot_v$env:VERSION`_SHA256SUMS.txt"
          $portableHash=(Get-FileHash $portableZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash=(Get-FileHash $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$portableHash  $([IO.Path]::GetFileName($portableZip))","$sourceHash  $([IO.Path]::GetFileName($sourceZip))") | Set-Content $shaFile -Encoding ascii

          $scanner=Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          & $scanner.FullName -Scan -ScanType 3 -File $portableZip -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender ZIP scan failed: $LASTEXITCODE" }

          "portable_zip=$portableZip" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_zip=$sourceZip" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha_file=$shaFile" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Archive exact release assets
        uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Telegram_Autopilot_v${{ env.VERSION }}_RELEASE_ASSETS
          path: |
            ${{ steps.assets.outputs.portable_zip }}
            ${{ steps.assets.outputs.source_zip }}
            ${{ steps.assets.outputs.sha_file }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag="v$env:VERSION"
          gh release create $tag `
            ${{ steps.assets.outputs.portable_zip }} `
            ${{ steps.assets.outputs.source_zip }} `
            ${{ steps.assets.outputs.sha_file }} `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "UA FREE Telegram Autopilot V2 $env:VERSION" `
            --notes-file $env:NOTES `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publish failed' }
