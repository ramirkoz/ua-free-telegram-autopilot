name: Observe RC32 finalizer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  actions: read
  contents: read

jobs:
  observe:
    if: github.event.pull_request.head.ref == 'trigger/observe-rc32-finalizer'
    runs-on: ubuntu-latest
    steps:
      - name: Show RC32 tag creation runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/create-rc32-tag.yml/runs?branch=main&per_page=10" --jq '.workflow_runs[] | [.id,.status,.conclusion,.head_sha,.created_at,.html_url] | @tsv'
