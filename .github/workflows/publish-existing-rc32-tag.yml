name: Publish verified Autopilot RC32

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-existing-rc32-tag.yml'

permissions:
  contents: write
  statuses: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Materialize and verify exact tagged RC32 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import hashlib, subprocess, zipfile
          tag='v0.1.0-rc32'
          order=[
            'PUBLIC_VERSION.txt','README.md','RELEASE_NOTES_v0.1.0-rc32.md','VERSION.txt','app.py',
            'telegram_autopilot/__init__.py','telegram_autopilot/ai_router.py','telegram_autopilot/article_extractor.py',
            'telegram_autopilot/codex_engine.py','telegram_autopilot/collector.py','telegram_autopilot/database.py',
            'telegram_autopilot/event_dedupe.py','telegram_autopilot/evidence_pack.py','telegram_autopilot/fact_guard.py',
            'telegram_autopilot/grammar_guard.py','telegram_autopilot/instance_lock.py','telegram_autopilot/language.py',
            'telegram_autopilot/language_tool_local.py','telegram_autopilot/local_ai_runtime.py','telegram_autopilot/logging_setup.py',
            'telegram_autopilot/main.py','telegram_autopilot/media.py','telegram_autopilot/media_pipeline.py',
            'telegram_autopilot/models.py','telegram_autopilot/network.py','telegram_autopilot/ollama_client.py',
            'telegram_autopilot/paths.py','telegram_autopilot/production_pipeline.py','telegram_autopilot/rewrite_verifier.py',
            'telegram_autopilot/secrets_store.py','telegram_autopilot/security.py','telegram_autopilot/service.py',
            'telegram_autopilot/startup_recovery.py','telegram_autopilot/telegram.py','telegram_autopilot/ui.py',
            'telegram_autopilot/ukrainian_quality.py']
          t37=(2026,8,21,10,37,8); t39=(2026,8,21,10,39,22); t40=(2026,8,21,10,40,24); t41=(2026,8,21,10,41,36)
          ts={p:t37 for p in order}
          for p in ['PUBLIC_VERSION.txt','README.md','RELEASE_NOTES_v0.1.0-rc32.md','VERSION.txt','telegram_autopilot/__init__.py','telegram_autopilot/media_pipeline.py','telegram_autopilot/service.py','telegram_autopilot/telegram.py']: ts[p]=t39
          for p in ['telegram_autopilot/language_tool_local.py','telegram_autopilot/network.py','telegram_autopilot/production_pipeline.py']: ts[p]=t40
          for p in ['telegram_autopilot/rewrite_verifier.py','telegram_autopilot/ukrainian_quality.py']: ts[p]=t41
          root=Path('release-src')
          for arc in order:
              data=subprocess.check_output(['git','show',f'{tag}:{arc}'])
              dst=root/arc; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(data)
          Path('release-assets').mkdir(exist_ok=True)
          source=Path('release-assets/UA_FREE_Telegram_Autopilot_v0.1.0-rc32_Source.zip')
          with zipfile.ZipFile(source,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for arc in order:
                  data=(root/arc).read_bytes()
                  zi=zipfile.ZipInfo(arc,ts[arc]); zi.compress_type=zipfile.ZIP_DEFLATED; zi.create_system=3; zi.external_attr=0x81A40000; zi.create_version=20; zi.extract_version=20
                  z.writestr(zi,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=6)
          sha=hashlib.sha256(source.read_bytes()).hexdigest()
          if sha!='585dbb015cc45f5e4d7f9ede987f14a3e701049e40de18d171373b88d4490291': raise SystemExit(f'canonical Source ZIP mismatch: {sha}')
          print('TAGGED_RC32_SOURCE_PASS_36_OF_36')
          print('CANONICAL_SOURCE_ZIP_PASS',sha)
          '@ | python -

      - name: Install pinned RC32 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check --force-reinstall pip==26.1.2 Pillow==12.3.0 cryptography==46.0.4 cffi==2.1.1 pycparser==3.0
          if ($LASTEXITCODE -ne 0) { throw 'runtime dependency install failed' }

      - name: Build and validate tagged Windows portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pyHome=(python -c "import sys; print(sys.base_prefix)").Trim()
          $stage=Join-Path $PWD 'portable-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $pyHome 'DLLs') $stage -Recurse -Force
          Copy-Item (Join-Path $pyHome 'Lib') $stage -Recurse -Force
          Copy-Item (Join-Path $pyHome 'tcl') $stage -Recurse -Force
          foreach ($name in @('python3.dll','python312.dll','vcruntime140.dll','vcruntime140_1.dll')) { Copy-Item (Join-Path $pyHome $name) $stage -Force }
          Copy-Item (Join-Path $pyHome 'pythonw.exe') (Join-Path $stage 'UA_FREE_Telegram_Autopilot.exe') -Force
          Copy-Item (Join-Path $pyHome 'python.exe') (Join-Path $stage '_runtime_console.exe') -Force
          Copy-Item release-src\app.py,release-src\VERSION.txt,release-src\PUBLIC_VERSION.txt,release-src\README.md,release-src\RELEASE_NOTES_v0.1.0-rc32.md -Destination $stage -Force
          Copy-Item release-src\telegram_autopilot -Destination $stage -Recurse -Force
          [IO.File]::WriteAllText((Join-Path $stage 'UA_FREE_Telegram_Autopilot._pth'), ".`nDLLs`nLib`nLib\site-packages`nimport site`n", [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText((Join-Path $stage '_runtime_console._pth'), ".`r`nDLLs`r`nLib`r`nLib\site-packages`r`nimport site`r`n", [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText((Join-Path $stage 'python312._pth'), ".`r`nDLLs`r`nLib`r`nLib\site-packages`r`nimport site`r`n", [Text.Encoding]::ASCII)
          New-Item -ItemType File -Force -Path (Join-Path $stage 'portable.flag') | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $stage 'clean_start.flag') | Out-Null
          Get-ChildItem $stage -Directory -Recurse -Filter '__pycache__' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $stage -File -Recurse -Filter '*.pyc' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $stage 'Data') -Recurse -Force -ErrorAction SilentlyContinue
          $exe=(Get-FileHash (Join-Path $stage 'UA_FREE_Telegram_Autopilot.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $console=(Get-FileHash (Join-Path $stage '_runtime_console.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exe -ne 'd72294fb338bc2fc8896d25a7395a4db466425427e1559e77185d5135a830681') { throw "launcher SHA mismatch $exe" }
          if ($console -ne '4d6f5f81a4bca11191c4c7c6b43632694d0a4ce74e068619d8fdc161d469859a') { throw "console SHA mismatch $console" }
          @'
          from pathlib import Path
          import hashlib, zipfile
          stage=Path('portable-stage')
          out=Path('release-assets/UA_FREE_Telegram_Autopilot_v0.1.0-rc32_Windows_Portable.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted((p for p in stage.rglob('*') if p.is_file()),key=lambda p:p.relative_to(stage).as_posix()): z.write(p,p.relative_to(stage).as_posix())
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              names=z.namelist(); assert len(names)==len(set(names))
              assert 'UA_FREE_Telegram_Autopilot.exe' in names and '_runtime_console.exe' in names
              assert not any(n.startswith('Data/') or '/Data/' in n for n in names)
              assert not any('__pycache__' in n or n.endswith('.pyc') for n in names)
              assert z.read('VERSION.txt').decode().strip()=='0.1.0-rc32'
              assert z.read('PUBLIC_VERSION.txt').decode().strip()=='0.1.0-rc32'
          psha=hashlib.sha256(out.read_bytes()).hexdigest()
          source=Path('release-assets/UA_FREE_Telegram_Autopilot_v0.1.0-rc32_Source.zip'); ssha=hashlib.sha256(source.read_bytes()).hexdigest()
          Path('release-assets/UA_FREE_Telegram_Autopilot_v0.1.0-rc32_SHA256SUMS.txt').write_text(f'{psha}  {out.name}\n{ssha}  {source.name}\n',encoding='ascii',newline='\n')
          print('TAGGED_PORTABLE_VALIDATION_PASS',psha,len(names))
          '@ | python -

      - name: Publish prerelease against existing verified tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v0.1.0-rc32'
          $portable='release-assets\UA_FREE_Telegram_Autopilot_v0.1.0-rc32_Windows_Portable.zip'
          $source='release-assets\UA_FREE_Telegram_Autopilot_v0.1.0-rc32_Source.zip'
          $sums='release-assets\UA_FREE_Telegram_Autopilot_v0.1.0-rc32_SHA256SUMS.txt'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $portable $source $sums --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title 'UA FREE Telegram Autopilot v0.1.0-rc32' --notes-file release-src\RELEASE_NOTES_v0.1.0-rc32.md --prerelease
          } else {
            gh release create $tag $portable $source $sums --repo $env:GITHUB_REPOSITORY --verify-tag --title 'UA FREE Telegram Autopilot v0.1.0-rc32' --notes-file release-src\RELEASE_NOTES_v0.1.0-rc32.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'release publication failed' }
          $data=(gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag") | ConvertFrom-Json
          if (-not $data.prerelease) { throw 'release is not prerelease' }
          $names=@($data.assets | ForEach-Object {$_.name})
          foreach ($n in @('UA_FREE_Telegram_Autopilot_v0.1.0-rc32_Windows_Portable.zip','UA_FREE_Telegram_Autopilot_v0.1.0-rc32_Source.zip','UA_FREE_Telegram_Autopilot_v0.1.0-rc32_SHA256SUMS.txt')) { if ($names -notcontains $n) { throw "missing asset $n" } }
          Write-Host "RC32_GITHUB_RELEASE_PASS $($data.html_url)"

      - name: Mark release PASS on tagged commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha=(git rev-parse refs/tags/v0.1.0-rc32).Trim()
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$sha" -f state=success -f context=rc32-release-final -f description="run_id=$env:GITHUB_RUN_ID" -f target_url="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'status publication failed' }
