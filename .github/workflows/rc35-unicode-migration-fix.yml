name: RC35 Unicode migration fix

on:
  push:
    branches: [main]
    paths:
      - tools/rc35_unicode_migration_fix.py
      - .github/workflows/rc35-unicode-migration-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Unicode-safe migration fix
        run: python tools/rc35_unicode_migration_fix.py
      - name: Compile changed source
        run: python -m compileall -q telegram_autopilot tests app_v2.py
      - name: Commit fixed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'RC35: Unicode-safe legacy channel migration'
          git push origin HEAD:main
