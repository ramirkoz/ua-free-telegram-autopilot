name: One-shot RC18 canonical source sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-rc18-source-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical RC18 source and synchronize whole files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          src=/tmp/UA_FREE_Telegram_Autopilot_v2.0.0-rc18_Source.zip
          curl -fL --retry 2 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=12KbXIIlZ_XrkHQUewMROctSsXM9IdvbT&export=download&confirm=t' \
            -o "$src"
          unzip -tq "$src"
          rm -rf /tmp/rc18-src
          mkdir -p /tmp/rc18-src
          unzip -q "$src" -d /tmp/rc18-src
          cd /tmp/rc18-src
          while IFS= read -r -d '' path; do
            path="${path#./}"
            current_sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
            desired_sha="$(python - "$path" <<'PY'
          import hashlib, pathlib, sys
          p=pathlib.Path(sys.argv[1]); b=p.read_bytes()
          print(hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest())
          PY
            )"
            if [ "$current_sha" = "$desired_sha" ]; then
              echo "exact $path"
              continue
            fi
            content="$(base64 -w0 "$path")"
            if [ -n "$current_sha" ]; then
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="Sync exact Autopilot v2.0.0-rc18: $path" \
                -f content="$content" \
                -f sha="$current_sha" \
                -f branch=main >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/$path" \
                -f message="Add exact Autopilot v2.0.0-rc18: $path" \
                -f content="$content" \
                -f branch=main >/dev/null
            fi
            echo "synced $path"
          done < <(find . -type f -print0 | sort -z)
