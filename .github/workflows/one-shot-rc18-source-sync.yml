name: One-shot RC18 canonical source sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-rc18-source-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact RC18 source and commit
        shell: bash
        run: |
          set -euo pipefail

          # Reconstruct the six canonical files that were not already present as Git blobs.
          base64 -d .sync/files/collector.py.gz.b64 | gzip -dc > telegram_autopilot/collector.py
          base64 -d .sync/files/telegram.py.gz.b64 | gzip -dc > telegram_autopilot/telegram.py
          base64 -d .sync/files/ui.py.gz.b64 | gzip -dc > telegram_autopilot/ui.py
          cat .sync/v2storage.part00 .sync/v2storage.part01 .sync/v2storage.part02 .sync/v2storage.part03 | base64 -d | gzip -dc > telegram_autopilot/v2/storage.py
          cat .sync/v2supervisor.part00 .sync/v2supervisor.part01 .sync/v2supervisor.fix00 .sync/v2supervisor.fix01 .sync/v2supervisor.fix02 | base64 -d | gzip -dc > telegram_autopilot/v2/supervisor.py
          cat .sync/v2ui.part00 .sync/v2ui.part01 .sync/v2ui.fix00 .sync/v2ui.fix01 .sync/v2ui.fix02 .sync/v2ui.fix03 .sync/v2ui.part03 | base64 -d | gzip -dc > telegram_autopilot/v2/ui.py

          # These three exact canonical blobs already exist in repository history.
          git cat-file blob 30643962e4d45e483ced5f4ab385d5335138837d > telegram_autopilot/v2/ingest.py
          git cat-file blob 15500b31c1d05f6258861a1662880836b7c831e5 > telegram_autopilot/v2/migration.py
          git cat-file blob 1137d0eec3aaa341cdd09ca3a23b51cf91d6a841 > telegram_autopilot/v2/publisher.py

          while read -r expected path; do
            actual="$(git hash-object "$path")"
            echo "$path $actual"
            test "$actual" = "$expected"
          done <<'EOF'
          a9ed009f8b3d3d4ba421de288ff61ff9dd2194a9 telegram_autopilot/collector.py
          b1bf4f8defc7bf770d4c568bc06e7ac27467c6a2 telegram_autopilot/telegram.py
          9ecb75eb5988148efc261dae5b4522c5d93a82a9 telegram_autopilot/ui.py
          30643962e4d45e483ced5f4ab385d5335138837d telegram_autopilot/v2/ingest.py
          15500b31c1d05f6258861a1662880836b7c831e5 telegram_autopilot/v2/migration.py
          1137d0eec3aaa341cdd09ca3a23b51cf91d6a841 telegram_autopilot/v2/publisher.py
          50cda4a4c9e464d5d490d39b5df101253fbcff77 telegram_autopilot/v2/storage.py
          efb51599a95ac2497aaa32f221ac4dc2367af44d telegram_autopilot/v2/supervisor.py
          a1615d322aad2ae22f3c654b568325543fd70b3f telegram_autopilot/v2/ui.py
          EOF

          python -m py_compile \
            telegram_autopilot/collector.py telegram_autopilot/telegram.py telegram_autopilot/ui.py \
            telegram_autopilot/v2/ingest.py telegram_autopilot/v2/migration.py telegram_autopilot/v2/publisher.py \
            telegram_autopilot/v2/storage.py telegram_autopilot/v2/supervisor.py telegram_autopilot/v2/ui.py

          rm -rf .sync
          git rm --ignore-unmatch .github/workflows/one-shot-rc18-source-sync.yml
          git config user.name 'UA FREE sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Synchronize canonical Autopilot v2.0.0-rc18 source'
          git push origin HEAD:main
