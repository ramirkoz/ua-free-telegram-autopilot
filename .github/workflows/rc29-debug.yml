name: RC29 Telegram parser debug

on:
  push:
    branches:
      - fix/rc29-telegram-entities-media

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Trace strict Telegram parser decisions
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          from telegram_autopilot.v2.strict_ingest import StrictTelegramParser

          url='https://t.me/s/zaporizhzhiacitycouncil'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          orig=StrictTelegramParser._add_media
          seen=0
          def traced(self,kind,url,classes):
              global seen
              if self.current is not None and seen < 40:
                  hard=set(self._NON_CONTENT_MEDIA_MARKERS)-set(self._SOFT_PREVIEW_MARKERS)
                  print('TRACE',self.current.get('post'),kind,
                        'hard=',self._contains_marker(classes,hard),
                        'direct=',self._contains_marker(classes,self._DIRECT_CONTENT_MEDIA_MARKERS) or self._generic_direct_content(classes),
                        'soft=',self._contains_marker(classes,self._SOFT_PREVIEW_MARKERS),
                        'classes=',sorted(classes),
                        'url=',str(url)[:90])
                  seen += 1
              return orig(self,kind,url,classes)
          StrictTelegramParser._add_media=traced
          p=StrictTelegramParser('zaporizhzhiacitycouncil')
          p.feed(html); p.close()
          print('ENTRIES',len(p.entries))
          for e in p.entries[-20:]:
              print('ENTRY',e.post,'media',len(e.media),'raw',e.raw_media_candidates,'noncontent',e.discarded_non_content,'thumb',e.discarded_video_thumb)
          PY
