name: Kick RC32 v2 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-rc32-v2-once.yml'

permissions:
  contents: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrigger v2 and remove dispatcher
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '\n# final rerun after obsolete RC9/RC10 tests cleanup\n' >> .github/workflows/finalize-rc32-release-v2.yml
          git rm .github/workflows/kick-rc32-v2-once.yml
          git add .github/workflows/finalize-rc32-release-v2.yml
          git commit -m 'Run final RC32 v2 release gate'
          git push origin HEAD:main
