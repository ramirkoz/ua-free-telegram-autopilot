name: RC76 one-time source cleanup

on:
  push:
    branches:
      - fix/rc76-editorial-weights-persistence

permissions:
  contents: write

jobs:
  patch-legacy-rc51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc76-editorial-weights-persistence
          fetch-depth: 0
      - name: Remove obsolete RC51 editorial-weight sabotage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('telegram_autopilot/rc51_feedback.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''            # RC51 removes manual topic quotas. Keep the legacy column for Data\n            # compatibility, but clear its values so old percentages cannot return\n            # through a stale UI save or future wrapper.\n            columns = {str(row[1]) for row in con.execute("PRAGMA table_info(channels)").fetchall()}\n            if "editorial_weights_json" in columns:\n                con.execute("UPDATE channels SET editorial_weights_json='[]' WHERE editorial_weights_json<>'[]'")\n''',
                  '''            # RC76 compatibility rule: reaction learning must never mutate operator-owned\n            # per-channel editorial categories/weights. Those settings are independent\n            # of reaction feedback and remain persisted in channels.editorial_weights_json.\n''',
              ),
              (
                  '''    def set_channel_editorial_weights_rc51(self, channel_id: int, items) -> None:\n        with self.connect() as con:\n            con.execute(\n                "UPDATE channels SET editorial_weights_json='[]',updated_at=datetime('now') WHERE id=?",\n                (int(channel_id),),\n            )\n\n''',
                  '',
              ),
              ('    Database.set_channel_editorial_weights = set_channel_editorial_weights_rc51\n', ''),
              (
                  '''    # Manual topic buckets are retired. Keep old schema only for backward Data\n    # compatibility; no classifier/percentage call participates in publication.\n    no_weights = lambda channel: []\n    rc42.parse_editorial_weights = no_weights\n    rc45.parse_editorial_weights = no_weights\n    rc46.parse_editorial_weights = no_weights\n''',
                  '''    # Reaction learning is independent of the operator-defined editorial balance.\n    # Do not replace rc42/rc45/rc46 category parsing here: later per-channel UI\n    # intentionally exposes those categories and weights as channel-owned settings.\n''',
              ),
              ('RC51 reaction-memory score={verdict.score:.3f}; manual topic quotas disabled.', 'RC51 reaction-memory score={verdict.score:.3f}; channel balance handled independently.'),
              ('RC51 installed: 👍/👎/🔥 feedback ranking, 7-day memory/history, no manual topic quotas', 'RC51 installed: 👍/👎/🔥 feedback ranking and 7-day memory/history; channel editorial weights preserved'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected RC51 legacy block not found: ' + old[:80])
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_autopilot/rc51_feedback.py
          git diff --cached --check
          git commit -m "RC76: remove obsolete RC51 editorial-weight overrides"
          git push origin HEAD:fix/rc76-editorial-weights-persistence