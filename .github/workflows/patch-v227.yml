name: Apply Autopilot 2.2.7 publisher patch
on:
  push:
    branches:
      - release/autopilot-v2.2.7-telegram-photo-parity
    paths:
      - Tools/patch_227_upload.py
      - .github/workflows/patch-v227.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/autopilot-v2.2.7-telegram-photo-parity
          persist-credentials: true
      - name: Patch failed-media text fallback
        run: python Tools/patch_227_upload.py
      - name: Commit and push publisher
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_autopilot/v2/publisher.py
          git commit -m "2.2.7: block Telegram text fallback after media download failure"
          git push
