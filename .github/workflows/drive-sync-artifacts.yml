name: V2 Exact Release Assets for Drive Sync

on:
  push:
    branches: [main]
    paths:
      - VERSION.txt
      - .github/workflows/drive-sync-artifacts.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  archive-release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve current version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION.txt)"
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Wait for GitHub Release and download exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          mkdir -p release-assets
          found=0
          for i in $(seq 1 30); do
            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              found=1
              break
            fi
            sleep 10
          done
          test "$found" = 1
          gh release download "$tag" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --pattern "UA_FREE_Telegram_Autopilot_v${VERSION}_Windows_Portable.zip" \
            --pattern "UA_FREE_Telegram_Autopilot_v${VERSION}_Source.zip" \
            --pattern "UA_FREE_Telegram_Autopilot_v${VERSION}_SHA256SUMS.txt"
          test -s "release-assets/UA_FREE_Telegram_Autopilot_v${VERSION}_Windows_Portable.zip"
          test -s "release-assets/UA_FREE_Telegram_Autopilot_v${VERSION}_Source.zip"
          test -s "release-assets/UA_FREE_Telegram_Autopilot_v${VERSION}_SHA256SUMS.txt"
          (cd release-assets && sha256sum -c "UA_FREE_Telegram_Autopilot_v${VERSION}_SHA256SUMS.txt")

      - name: Upload exact release assets for Drive synchronization
        uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Telegram_Autopilot_v${{ env.VERSION }}_EXACT_RELEASE_ASSETS
          path: release-assets/*
          compression-level: 0
          retention-days: 30

      - name: Report exact-asset sync status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          desc="V2 exact release asset archive failed"
          if [ "$JOB_STATUS" = success ]; then
            state=success
            desc="v${VERSION} exact GitHub Release assets ready for Drive sync"
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context='v2-drive-sync-assets' \
            -f description="$desc" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
