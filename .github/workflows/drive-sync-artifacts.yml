name: RC37 Exact Release Assets for Drive Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/drive-sync-artifacts.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  archive-release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download exact GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download v0.1.0-rc37 \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --pattern 'UA_FREE_Telegram_Autopilot_v0.1.0-rc37_Windows_Portable.zip' \
            --pattern 'UA_FREE_Telegram_Autopilot_v0.1.0-rc37_Source.zip' \
            --pattern 'UA_FREE_Telegram_Autopilot_v0.1.0-rc37_SHA256SUMS.txt'
          test -s release-assets/UA_FREE_Telegram_Autopilot_v0.1.0-rc37_Windows_Portable.zip
          test -s release-assets/UA_FREE_Telegram_Autopilot_v0.1.0-rc37_Source.zip
          test -s release-assets/UA_FREE_Telegram_Autopilot_v0.1.0-rc37_SHA256SUMS.txt
          (cd release-assets && sha256sum -c UA_FREE_Telegram_Autopilot_v0.1.0-rc37_SHA256SUMS.txt)

      - name: Upload exact release assets for Drive synchronization
        uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Telegram_Autopilot_v0.1.0-rc37_EXACT_RELEASE_ASSETS
          path: release-assets/*
          compression-level: 0
          retention-days: 7

      - name: Report exact-asset sync status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          desc='RC37 exact release asset archive failed'
          if [ "$JOB_STATUS" = success ]; then
            state=success
            desc='RC37 exact GitHub Release assets ready for Drive sync'
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context='rc37-drive-sync-assets' \
            -f description="$desc" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
