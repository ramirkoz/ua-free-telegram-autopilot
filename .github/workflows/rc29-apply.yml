name: RC29 apply staged fix

on:
  push:
    branches:
      - fix/rc29-telegram-entities-media

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc29-telegram-entities-media
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact RC29 source snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json, zlib

          def unpack(payload: str) -> bytes:
              return zlib.decompress(base64.b64decode(payload.strip()))

          Path('telegram_autopilot/telegram.py').write_bytes(
              unpack(Path('tools/rc29_payload_telegram.txt').read_text(encoding='utf-8'))
          )
          rest = json.loads(Path('tools/rc29_payload_rest.json').read_text(encoding='utf-8'))
          for name, payload in rest.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(unpack(payload))

          for name in ('VERSION.txt', 'PUBLIC_VERSION.txt', 'V2_VERSION.txt'):
              Path(name).write_text('2.0.0-rc29\n', encoding='utf-8')
          Path('telegram_autopilot/__init__.py').write_text(
              '"""UA FREE Telegram Autopilot."""\n\n'
              '__version__ = "2.0.0-rc29"\n'
              'APP_NAME = "UA FREE Telegram Autopilot V2"\n',
              encoding='utf-8',
          )
          Path('telegram_autopilot/v2/__init__.py').write_text(
              '"""Clean V2 runtime.\n\n'
              'This package is deliberately independent from the historical RC monkey-patch stack.\n'
              'RC82 is treated as a behavioural specification only; no ``rcXX`` module is imported\n'
              'from V2.\n'
              '"""\n\n'
              'V2_SCHEMA_VERSION = 2\n'
              'V2_VERSION = "2.0.0-rc29"\n',
              encoding='utf-8',
          )
          print('RC29 source snapshot applied')
          PY
      - name: Compile changed runtime
        run: python -m compileall -q telegram_autopilot tests app_v2.py
      - name: Remove staging transport
        shell: bash
        run: |
          git rm -f tools/rc29_payload_telegram.txt tools/rc29_payload_rest.json .github/workflows/rc29-apply.yml
      - name: Commit RC29
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'RC29: fix Telegram false phone links and live media extraction'
          git push origin HEAD:fix/rc29-telegram-entities-media
