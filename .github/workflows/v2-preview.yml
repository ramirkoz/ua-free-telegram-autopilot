name: V2 Preview Build

on:
  push:
    branches:
      - develop/v2-clean-core
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v2-preview:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      V2_VERSION: 2.0.0-rc3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile and run regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m compileall -q telegram_autopilot tests app_v2.py
          if ($LASTEXITCODE -ne 0) { throw 'compileall failed' }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'pytest failed' }
          python -m pytest -q tests/test_v2_migration_windows.py tests/test_v2_credentials_migration.py
          if ($LASTEXITCODE -ne 0) { throw 'V2 migration regressions failed' }
          python -c "from telegram_autopilot.v2 import V2_VERSION; assert V2_VERSION == '$env:V2_VERSION', V2_VERSION; print('V2_VERSION_OK', V2_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'V2 version gate failed' }

      - name: Enforce clean V2 source contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import pathlib, re
          root = pathlib.Path('telegram_autopilot/v2')
          bad = []
          patterns = (
              r'install_rc', r'_PREV\[', r'from\s+\.\.rc\d', r'from\s+\.rc\d',
              r'import\s+telegram_autopilot\.rc\d', r'from\s+\.\.\s+import\s+rc\d',
          )
          for path in root.glob('*.py'):
              text = path.read_text(encoding='utf-8')
              for pattern in patterns:
                  if re.search(pattern, text):
                      bad.append(f'{path}: {pattern}')
          if bad:
              raise SystemExit('V2 RC contamination:\n' + '\n'.join(bad))
          migration = pathlib.Path('telegram_autopilot/v2/migration_service.py').read_text(encoding='utf-8')
          if 'os.replace(' in migration:
              raise SystemExit('Windows-unsafe os.replace remains in migration_service.py')
          credentials = pathlib.Path('telegram_autopilot/v2/legacy_credentials.py').read_text(encoding='utf-8')
          if 'with_suffix(".migration.tmp")' in credentials or "with_suffix('.migration.tmp')" in credentials:
              raise SystemExit('Credential temp-name collision pattern returned')
          print('V2_CLEAN_SOURCE_AND_MIGRATION_CONTRACT_OK')
          '@ | Set-Content -Path $env:RUNNER_TEMP\v2_clean_gate.py -Encoding utf8
          python $env:RUNNER_TEMP\v2_clean_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'V2 clean-source gate failed' }

      - name: Build signed V2 portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist-v2'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $portableName = "UA_FREE_Telegram_Autopilot_v$env:V2_VERSION`_Windows_Portable"
          $stage = Join-Path $dist $portableName
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $pyHome = (python -c "import sys; print(sys.base_prefix)").Trim()
          $pythonExe = Join-Path $pyHome 'python.exe'
          $pythonwExe = Join-Path $pyHome 'pythonw.exe'
          if (-not (Test-Path $pythonExe)) { throw "Python runtime not found: $pythonExe" }
          if (-not (Test-Path $pythonwExe)) { throw "Signed pythonw runtime not found: $pythonwExe" }
          Copy-Item -Path (Join-Path $pyHome '*') -Destination $stage -Recurse -Force

          Copy-Item telegram_autopilot -Destination $stage -Recurse -Force
          Copy-Item app_v2.py,V2_VERSION.txt,V2_RELEASE_NOTES_v2.0.0-rc3.md -Destination $stage -Force

          Get-ChildItem (Join-Path $stage 'telegram_autopilot') -File -Filter 'rc*.py' -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem $stage -Directory -Recurse -Filter '__pycache__' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $stage -File -Recurse -Filter '*.pyc' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $stage 'Data') -Recurse -Force -ErrorAction SilentlyContinue

          @"
          __version__ = "$env:V2_VERSION"
          "@ | Set-Content -Path (Join-Path $stage 'telegram_autopilot\__init__.py') -Encoding utf8

          Copy-Item $pythonExe (Join-Path $stage '_runtime_console.exe') -Force
          Copy-Item $pythonwExe (Join-Path $stage 'UA_FREE_Telegram_Autopilot.exe') -Force
          @('.', 'DLLs', 'Lib', 'Lib\site-packages', 'import site') | Set-Content -Path (Join-Path $stage '_runtime_console._pth') -Encoding ascii
          @('.', 'DLLs', 'Lib', 'Lib\site-packages', 'import site') | Set-Content -Path (Join-Path $stage 'UA_FREE_Telegram_Autopilot._pth') -Encoding ascii

          @'
          import os
          import sys
          if os.path.basename(sys.executable).casefold() == 'ua_free_telegram_autopilot.exe':
              from telegram_autopilot.v2.main import main
              os._exit(int(main() or 0))
          '@ | Set-Content -Path (Join-Path $stage 'sitecustomize.py') -Encoding utf8

          @"
          UA FREE Telegram Autopilot V2 $env:V2_VERSION

          Розпакуйте у НОВУ папку і запустіть UA_FREE_Telegram_Autopilot.exe.
          Для перенесення RC82 відкрийте вкладку «Міграція» і виберіть стару Data.
          Стара SQLite читається read-only. V2 database: Data\telegram_autopilot_v2.sqlite3
          Backup міграції: Data\migration_backups
          Логи: Data\logs\v2
          "@ | Set-Content -Path (Join-Path $stage 'README_V2.txt') -Encoding utf8

          New-Item -ItemType File -Force -Path (Join-Path $stage 'portable.flag') | Out-Null
          $rcFiles = @(Get-ChildItem (Join-Path $stage 'telegram_autopilot') -File -Filter 'rc*.py' -ErrorAction SilentlyContinue)
          if ($rcFiles.Count -ne 0) { throw "Historical RC modules remain in portable: $($rcFiles.Name -join ', ')" }

          "PORTABLE_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTABLE_NAME=$portableName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate clean packaged imports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:PORTABLE_STAGE
          try {
            & .\_runtime_console.exe -I -c "from telegram_autopilot import __version__; from telegram_autopilot.v2 import V2_VERSION; from telegram_autopilot.v2.storage import V2Store; from telegram_autopilot.v2.runtime import RuntimeEngine; from telegram_autopilot.v2.ui import MainWindow; from telegram_autopilot.v2.migration_service import MigrationManager; assert __version__ == V2_VERSION == '$env:V2_VERSION'; print('V2_PACKAGED_IMPORT_OK', V2_VERSION)"
            if ($LASTEXITCODE -ne 0) { throw 'Packaged V2 import gate failed' }
          } finally {
            Pop-Location
          }

      - name: Native Windows credential-pair migration smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = $env:PORTABLE_STAGE
          $legacy = Join-Path $env:RUNNER_TEMP 'v2-legacy-credentials-Data'
          $target = Join-Path $env:RUNNER_TEMP 'v2-rc3-credentials-target'
          Remove-Item $legacy,$target -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $legacy,$target | Out-Null
          Set-Content -Path (Join-Path $legacy 'secrets.key') -Value 'legacy-key-native-windows' -NoNewline -Encoding ascii
          Set-Content -Path (Join-Path $legacy 'secrets.secure') -Value 'legacy-secure-native-windows' -NoNewline -Encoding ascii
          $env:LEGACY_DATA_SMOKE = $legacy
          $env:UA_FREE_TELEGRAM_AUTOPILOT_DATA = $target
          Push-Location $stage
          try {
            & .\_runtime_console.exe -I -c "import os,sqlite3,pathlib; p=pathlib.Path(os.environ['LEGACY_DATA_SMOKE']); sqlite3.connect(p/'telegram_autopilot.sqlite3').close(); from telegram_autopilot.v2.legacy_credentials import import_legacy_secrets; ok,msg=import_legacy_secrets(p); t=pathlib.Path(os.environ['UA_FREE_TELEGRAM_AUTOPILOT_DATA']); assert ok,msg; assert (t/'secrets.key').read_bytes()==b'legacy-key-native-windows'; assert (t/'secrets.secure').read_bytes()==b'legacy-secure-native-windows'; assert not list(t.glob('*.migration.tmp')); print('V2_RC3_NATIVE_WINDOWS_CREDENTIAL_PAIR_PASS')"
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows credential migration smoke failed' }
          } finally {
            Pop-Location
            Remove-Item Env:LEGACY_DATA_SMOKE -ErrorAction SilentlyContinue
            Remove-Item Env:UA_FREE_TELEGRAM_AUTOPILOT_DATA -ErrorAction SilentlyContinue
          }

      - name: Validate signed launcher and native Windows GUI startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = $env:PORTABLE_STAGE
          $launcher = Join-Path $stage 'UA_FREE_Telegram_Autopilot.exe'
          $signature = Get-AuthenticodeSignature $launcher
          if ($signature.Status -ne 'Valid') { throw "Launcher signature is not valid: $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch 'Python Software Foundation') { throw "Unexpected launcher signer: $($signature.SignerCertificate.Subject)" }

          $smokeData = Join-Path $env:RUNNER_TEMP 'autopilot-v2-rc3-smoke-data'
          Remove-Item $smokeData -Recurse -Force -ErrorAction SilentlyContinue
          $env:UA_FREE_TELEGRAM_AUTOPILOT_DATA = $smokeData
          $p = Start-Process -FilePath $launcher -WorkingDirectory $stage -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "Packaged V2 EXE exited during smoke test with code $($p.ExitCode)" }
          $db = Join-Path $smokeData 'telegram_autopilot_v2.sqlite3'
          if (-not (Test-Path $db)) { throw 'Packaged V2 EXE did not initialize telegram_autopilot_v2.sqlite3' }
          & taskkill.exe /PID $p.Id /T /F | Out-Null
          Remove-Item Env:UA_FREE_TELEGRAM_AUTOPILOT_DATA -ErrorAction SilentlyContinue
          Write-Host 'V2_RC3_NATIVE_WINDOWS_GUI_SMOKE_PASS'

      - name: Microsoft Defender scan extracted portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $scanner) { throw 'Microsoft Defender command-line scanner is unavailable' }
          & $scanner.FullName -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { throw "Defender signature update failed: $LASTEXITCODE" }
          & $scanner.FullName -Scan -ScanType 3 -File $env:PORTABLE_STAGE -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender detected or could not scan extracted V2 runtime: $LASTEXITCODE" }

      - name: Build ZIP and checksum and scan ZIP
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist-v2'
          $zip = Join-Path $dist "$env:PORTABLE_NAME.zip"
          Compress-Archive -Path (Join-Path $env:PORTABLE_STAGE '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaFile = Join-Path $dist "$env:PORTABLE_NAME`_SHA256.txt"
          "$hash  $([IO.Path]::GetFileName($zip))" | Set-Content $shaFile -Encoding ascii
          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $scanner) { throw 'Microsoft Defender command-line scanner is unavailable for ZIP scan' }
          & $scanner.FullName -Scan -ScanType 3 -File $zip -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender detected or could not scan V2 ZIP: $LASTEXITCODE" }
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha_file=$shaFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload exact V2 release assets
        uses: actions/upload-artifact@v4
        with:
          name: UA_FREE_Telegram_Autopilot_v${{ env.V2_VERSION }}_RELEASE_ASSETS
          path: |
            ${{ steps.assets.outputs.zip }}
            ${{ steps.assets.outputs.sha_file }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish or refresh GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:V2_VERSION"
          $zip = "${{ steps.assets.outputs.zip }}"
          $shaFile = "${{ steps.assets.outputs.sha_file }}"
          $notes = 'V2_RELEASE_NOTES_v2.0.0-rc3.md'
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "UA FREE Telegram Autopilot V2 $env:V2_VERSION" --notes-file $notes --prerelease
            gh release upload $tag $zip $shaFile --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $zip $shaFile --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "UA FREE Telegram Autopilot V2 $env:V2_VERSION" --notes-file $notes --prerelease
          }
          Write-Host "V2_PRERELEASE_PUBLISHED $tag SHA256=${{ steps.assets.outputs.sha256 }}"
