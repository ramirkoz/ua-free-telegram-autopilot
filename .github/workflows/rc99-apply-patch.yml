name: RC99 Apply Patch

on:
  push:
    branches: [rc99-hardening]
    paths:
      - '.github/workflows/rc99-apply-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc99-hardening
          fetch-depth: 0
      - name: Apply staged RC99 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .rc99/patch.part* > /tmp/rc99.patch
          git apply --ignore-space-change --ignore-whitespace /tmp/rc99.patch
          python - <<'PY'
          from pathlib import Path
          p = Path('telegram_autopilot/v2/runtime.py')
          raw = p.read_bytes()
          eol = '\r\n' if b'\r\n' in raw else '\n'
          text = raw.decode('utf-8').replace('\r\n', '\n')
          start = text.index('    def _watchdog_loop(self) -> None:\n')
          end = text.index('    def refresh_channels(self) -> None:\n', start)
          lines = [
              '    def _watchdog_loop(self) -> None:',
              '        """Continuously restore dead per-channel workers/collectors while runtime is expected to run."""',
              '        lease_recovery_tick = 0',
              '        while not self.stop_event.wait(5.0):',
              '            try:',
              '                lease_recovery_tick += 1',
              '                if lease_recovery_tick >= 12:',
              '                    recovered = int(self.store.recover_stale_leases() or 0)',
              '                    lease_recovery_tick = 0',
              '                    if recovered:',
              '                        event("worker", "watchdog recovered stale leases", level=logging.WARNING, recovered=recovered)',
              '                enabled = [int(row["id"]) for row in self.store.list_channels(enabled_only=True)]',
              '                for channel_id in enabled:',
              '                    with self._lock:',
              '                        worker_was_alive = bool(self._threads.get(channel_id) and self._threads[channel_id].is_alive())',
              '                        collector_was_alive = bool(self._collector_threads.get(channel_id) and self._collector_threads[channel_id].is_alive())',
              '                    self._start_channel(channel_id)',
              '                    with self._lock:',
              '                        worker_is_alive = bool(self._threads.get(channel_id) and self._threads[channel_id].is_alive())',
              '                        collector_is_alive = bool(self._collector_threads.get(channel_id) and self._collector_threads[channel_id].is_alive())',
              '                    if not worker_was_alive and worker_is_alive:',
              '                        event("worker", "self-heal restarted channel worker", level=logging.WARNING, channel_id=channel_id)',
              '                    if not collector_was_alive and collector_is_alive:',
              '                        event("worker", "self-heal restarted channel collector", level=logging.WARNING, channel_id=channel_id)',
              '            except Exception as exc:',
              '                event("worker", "runtime watchdog error", level=logging.ERROR, detail=str(exc)[:1200])',
              '',
          ]
          block = '\n'.join(lines) + '\n'
          text = text[:start] + block + text[end:]
          p.write_bytes(text.replace('\n', eol).encode('utf-8'))
          PY
          python -m compileall -q telegram_autopilot
          rm -rf .rc99
          rm -f .github/workflows/rc99-apply-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RC99: harden runtime after independent code review'
          git push origin HEAD:rc99-hardening
