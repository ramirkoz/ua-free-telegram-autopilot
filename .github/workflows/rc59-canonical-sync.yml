name: RC59 canonical sync apply

on:
  push:
    branches: [release/rc59-throughput-repair]
    paths:
      - .sync/rc59_delta.zip
      - .github/workflows/rc59-canonical-sync.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact RC59 delta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $size = (Get-Item ".sync/rc59_delta.zip").Length
          if ($size -ne 70587) { throw "Unexpected delta size: $size" }
          $hash = (Get-FileHash ".sync/rc59_delta.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "2860890f1e62b7207824e4493863081831a3889675576fc2b06e964fe32339a1") { throw "Delta SHA mismatch: $hash" }

      - name: Apply RC59 delta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive ".sync/rc59_delta.zip" -DestinationPath ".rc59_apply" -Force
          Get-ChildItem ".rc59_apply" -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path ".rc59_apply").Path.Length + 1)
            $dest = Join-Path (Resolve-Path ".").Path $rel
            New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
            Copy-Item $_.FullName $dest -Force
          }
          Remove-Item ".rc59_apply" -Recurse -Force
          Remove-Item ".sync" -Recurse -Force
          Remove-Item ".github/workflows/rc59-canonical-sync.yml" -Force

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency install failed" }

      - name: Compile
        run: python -m compileall -q telegram_autopilot tests app_v2.py

      - name: Full regression suite
        run: python -m pytest -q

      - name: RC59 architecture gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((Get-Content VERSION.txt -Raw).Trim() -ne "2.0.0-rc59") { throw "VERSION mismatch" }
          if ((Get-Content V2_VERSION.txt -Raw).Trim() -ne "2.0.0-rc59") { throw "V2 mismatch" }
          if ((Get-Content PUBLIC_VERSION.txt -Raw).Trim() -ne "2.0.0-rc59") { throw "PUBLIC mismatch" }

          $dedupe = Get-Content "telegram_autopilot/v2/event_dedupe_guard.py" -Raw
          $editorial = Get-Content "telegram_autopilot/v2/editorial.py" -Raw
          $supervisor = Get-Content "telegram_autopilot/v2/supervisor.py" -Raw
          $storage = Get-Content "telegram_autopilot/v2/storage.py" -Raw
          $ui = Get-Content "telegram_autopilot/v2/ui.py" -Raw

          foreach ($runtime in @($dedupe,$editorial,$supervisor)) {
            if ($runtime.ToLowerInvariant().Contains("ctrl+ua")) { throw "channel-name hardcode leaked into runtime" }
            if ($runtime.ToLowerInvariant().Contains("продано")) { throw "channel-name hardcode leaked into runtime" }
          }
          if (-not $dedupe.Contains("nearby taxonomic evidence")) { throw "scientific precision repair missing" }
          if (-not $editorial.Contains("editorial_thresholds_json")) { throw "per-channel editorial thresholds missing" }
          if (-not $storage.Contains("output_starvation_window_hours")) { throw "per-channel starvation settings missing" }
          if (-not $supervisor.Contains("CHANNEL_OUTPUT_STARVATION_")) { throw "starvation incident missing" }
          if (-not $ui.Contains("Пороги editorial JSON")) { throw "editorial thresholds not exposed in channel UI" }
          if (-not $ui.Contains("Контроль голодування виходу")) { throw "starvation policy not exposed in channel UI" }
          Write-Host "RC59_ARCHITECTURE_OK"

      - name: Commit clean canonical RC59
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "RC59: config-driven throughput repair"
          git push origin HEAD:release/rc59-throughput-repair
