name: RC53 temporary logic gate

on:
  push:
    branches:
      - fix/rc53-channel-dedupe-profile

jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Compile
        run: python -m compileall -q telegram_autopilot tests app_v2.py
      - name: RC53 targeted tests
        run: python -m pytest -q tests/test_v2_rc52_event_dedupe.py
