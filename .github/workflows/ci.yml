name: Autopilot CI

on:
  push:
    branches:
      - main
      - develop/**
      - hotfix/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    name: Source gate / Ubuntu / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Reject committed runtime Data and secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(Data/|.*\.(sqlite|sqlite3|db|log|key|secure)$)' ; then
            echo "Runtime Data/secrets must not be committed."
            exit 1
          fi

      - name: Compile source
        run: python -m compileall -q telegram_autopilot tests app.py

      - name: Run regression tests
        run: python -m pytest -q

      - name: Import core without creating production Data
        shell: bash
        run: |
          set -euo pipefail
          export UA_FREE_TELEGRAM_AUTOPILOT_DATA="$RUNNER_TEMP/autopilot-data"
          python - <<'PY'
          from pathlib import Path
          from telegram_autopilot import __version__
          from telegram_autopilot.database import Database
          from telegram_autopilot.rc33_policy import install_rc33_policy
          from telegram_autopilot.rc35_source_compat import install_rc35_source_compat
          from telegram_autopilot.rc44_source_transport import install_rc44_source_transport
          from telegram_autopilot.rc37_policy import install_rc37_policy
          from telegram_autopilot.rc38_policy import install_rc38_policy
          from telegram_autopilot.rc39_policy import install_rc39_policy
          from telegram_autopilot.rc40_policy import install_rc40_policy
          from telegram_autopilot.rc41_policy import install_rc41_policy
          from telegram_autopilot.rc42_policy import install_rc42_policy
          install_rc33_policy()
          install_rc35_source_compat()
          install_rc44_source_transport()
          install_rc37_policy()
          install_rc38_policy()
          install_rc39_policy()
          install_rc40_policy()
          install_rc41_policy()
          install_rc42_policy()
          db = Database()
          db.quick_check()
          with db.connect() as con:
              channel_cols = {row[1] for row in con.execute("PRAGMA table_info(channels)")}
              article_cols = {row[1] for row in con.execute("PRAGMA table_info(articles)")}
          assert "editorial_weights_json" in channel_cols
          assert "editorial_category" in article_cols
          expected = Path("VERSION.txt").read_text(encoding="utf-8").strip()
          assert __version__ == expected, (__version__, expected)
          print("AUTOPILOT_SOURCE_GATE_OK", __version__)
          PY

  windows-gate:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile source
        shell: pwsh
        run: python -m compileall -q telegram_autopilot tests app.py

      - name: Run regression tests
        shell: pwsh
        run: python -m pytest -q

      - name: Live supported-source collection gate
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = $PWD.Path
          @'
          from telegram_autopilot.rc35_source_compat import install_rc35_source_compat
          from telegram_autopilot.rc44_source_transport import install_rc44_source_transport
          from telegram_autopilot.models import Source
          install_rc35_source_compat()
          install_rc44_source_transport()
          from telegram_autopilot.collector import detect_source, collect_source

          checks = [
              ("Ars Technica", "https://arstechnica.com/", 100),
              ("Rest of World", "https://restofworld.org/feed/latest/", 87),
              ("Knowable Magazine", "https://knowablemagazine.org/rss", 90),
          ]
          for index, (name, url, priority) in enumerate(checks, start=1):
              detected = detect_source(url)
              source = Source(id=index, channel_id=1, kind=detected.kind, name=name, url=detected.url, enabled=True, initialized=False, last_checked_at=None, last_error=None, priority=priority)
              items = collect_source(source)
              assert items, f"{name} detected as {detected.kind} ({detected.url}) but returned zero articles"
              assert any((item.title or '').strip() for item in items)
              print("LIVE_SOURCE_COLLECTION_OK", name, detected.kind, detected.url, len(items), items[0].title[:120])
          '@ | Set-Content -Path $env:RUNNER_TEMP\source_live_gate.py -Encoding utf8
          python $env:RUNNER_TEMP\source_live_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Live supported-source collection gate failed" }

      - name: Import Windows entrypoint and verify isolated database
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:UA_FREE_TELEGRAM_AUTOPILOT_DATA = Join-Path $env:RUNNER_TEMP "autopilot-data"
          python -c "import tkinter; import telegram_autopilot.main; from telegram_autopilot.rc33_policy import install_rc33_policy; from telegram_autopilot.rc35_source_compat import install_rc35_source_compat; from telegram_autopilot.rc44_source_transport import install_rc44_source_transport; from telegram_autopilot.rc37_policy import install_rc37_policy; from telegram_autopilot.rc38_policy import install_rc38_policy; from telegram_autopilot.rc39_policy import install_rc39_policy; from telegram_autopilot.rc40_policy import install_rc40_policy; from telegram_autopilot.rc41_policy import install_rc41_policy; from telegram_autopilot.rc42_policy import install_rc42_policy; install_rc33_policy(); install_rc35_source_compat(); install_rc44_source_transport(); install_rc37_policy(); install_rc38_policy(); install_rc39_policy(); install_rc40_policy(); install_rc41_policy(); install_rc42_policy(); from telegram_autopilot.database import Database; db=Database(); db.quick_check(); from telegram_autopilot import __version__; import pathlib; expected=pathlib.Path('VERSION.txt').read_text(encoding='utf-8').strip(); assert __version__ == expected; print('AUTOPILOT_WINDOWS_SOURCE_GATE_OK', __version__)"
          if ($LASTEXITCODE -ne 0) { throw "Windows import gate failed" }