name: RC57 canonical sync apply

on:
  push:
    branches: [sync/rc57-full-canonical]
    paths:
      - .sync/rc57_delta.zip
      - .github/workflows/rc57-live-overlay-intake.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact RC57 delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .sync/rc57_delta.zip)" -eq 101682
          echo '1535fd35e6ee19f5a7d50d88775d3f364a1af7fcd74e0b39d633685fe493a24a  .sync/rc57_delta.zip' | sha256sum -c -
          unzip -tq .sync/rc57_delta.zip
      - name: Apply canonical RC57 delta
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq .sync/rc57_delta.zip -d .
          rm -rf .sync
          rm -f .github/workflows/rc57-live-overlay-intake.yml
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile RC57
        run: python -m compileall -q telegram_autopilot tests app_v2.py
      - name: Full RC57 regression suite
        run: python -m pytest -q
      - name: Canonical version gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION.txt)" = "2.0.0-rc57"
          test "$(cat V2_VERSION.txt)" = "2.0.0-rc57"
          test "$(cat PUBLIC_VERSION.txt)" = "2.0.0-rc57"
          ! grep -R --line-number -E 'channel_id[[:space:]]*==[[:space:]]*[123]|_profile\(row\)' telegram_autopilot/v2/event_dedupe_guard.py
          ! grep -R --line-number -E 'lead_ink|scroll_papyrus|volcanic_archive|wild_cat' telegram_autopilot/v2/event_dedupe_guard.py
      - name: Commit canonical RC57
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'RC57: full canonical sync of proven live RC56 plus channel-configurable dedupe'
          git push origin HEAD:sync/rc57-full-canonical
