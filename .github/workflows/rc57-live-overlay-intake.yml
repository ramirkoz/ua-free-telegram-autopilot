name: RC57 canonical sync apply

on:
  push:
    branches: [sync/rc57-full-canonical]
    paths:
      - .sync/rc57_delta.zip
      - .github/workflows/rc57-live-overlay-intake.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact RC57 delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .sync/rc57_delta.zip)" -eq 104878
          echo '10a31aa4bb8dfcd2a89bf75aa7a73376722d5bdfd88311628869af4fcef89e3f  .sync/rc57_delta.zip' | sha256sum -c -
          unzip -tq .sync/rc57_delta.zip
      - name: Apply canonical RC57 delta
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq .sync/rc57_delta.zip -d .
          rm -rf .sync
          rm -f .github/workflows/rc57-live-overlay-intake.yml
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Compile RC57
        run: python -m compileall -q telegram_autopilot tests app_v2.py
      - name: Full RC57 regression suite
        run: python -m pytest -q
      - name: Canonical architecture gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION.txt)" = "2.0.0-rc57"
          test "$(cat V2_VERSION.txt)" = "2.0.0-rc57"
          test "$(cat PUBLIC_VERSION.txt)" = "2.0.0-rc57"
          ! grep -R --exclude-dir='__pycache__' --line-number -E 'channel_id[[:space:]]*==[[:space:]]*[123]|channel\.id[[:space:]]*==[[:space:]]*[123]' telegram_autopilot/v2
          ! grep -R --exclude-dir='__pycache__' --line-number -E 'lead_ink|scroll_papyrus|volcanic_archive|wild_cat' telegram_autopilot/v2/event_dedupe_guard.py
          ! grep -R --exclude-dir='__pycache__' --line-number -E 'ПРОДАНО|CTRL\+UA' telegram_autopilot/v2 --exclude='storage.py'
      - name: Commit canonical RC57
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'RC57: full canonical sync of proven live RC56 plus channel-configurable runtime profiles'
          git push origin HEAD:sync/rc57-full-canonical
