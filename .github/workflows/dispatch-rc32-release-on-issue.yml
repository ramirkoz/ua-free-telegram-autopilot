name: Dispatch rc32 release on maintenance issue

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  dispatch:
    if: github.event.issue.title == '[automation] dispatch Autopilot rc32 release'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch rc32 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Remove one-time trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-rc32-release-on-issue.yml
          git commit -m "Remove rc32 release dispatch trigger"
          git push origin HEAD:main

      - name: Close maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
