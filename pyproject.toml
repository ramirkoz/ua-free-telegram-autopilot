[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ua-free-telegram-autopilot"
version = "2.0.0rc3"
description = "Standalone Windows Telegram news autopilot for UA FREE"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<47",
  "Telethon>=1.36,<2",
  "Pillow>=11.3,<13",
]

[tool.setuptools.packages.find]
include = ["telegram_autopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["telegram_autopilot"]
branch = true
