[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ua-free-telegram-autopilot"
version = "2.2.9"
description = "Standalone Windows Telegram news autopilot for UA FREE"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "UA FREE"}]
dependencies = []

[project.scripts]
ua-free-autopilot = "telegram_autopilot.__main__:main"

[tool.setuptools.packages.find]
include = ["telegram_autopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
